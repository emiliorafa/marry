<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma Pergunta Importante 💍</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose: #e8496a;
      --blush: #f9c6d0;
      --gold: #d4a853;
      --cream: #fff8f0;
      --deep: #2a1220;
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      overflow: hidden;
    }

    /* ===== TELA DE PROPOSTA ===== */
    #proposal {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 60%, #ffe4ec 0%, #fff0f5 40%, var(--cream) 100%);
      z-index: 10;
      transition: opacity 0.8s ease;
    }

    .hearts-bg {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    }
    .heart-float {
      position: absolute;
      font-size: clamp(14px, 2vw, 26px);
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }

    .ring {
      font-size: clamp(48px, 10vw, 90px);
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(232,73,106,0.4));
      margin-bottom: 24px;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1) rotate(-5deg); }
      50%      { transform: scale(1.12) rotate(5deg); }
    }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 68px);
      color: var(--deep);
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      animation: fadeSlideIn 1s ease both;
    }
    .question em { color: var(--rose); font-style: italic; }

    .subtitle {
      font-size: clamp(13px, 1.8vw, 18px);
      color: #a07080;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 52px;
      animation: fadeSlideIn 1.2s ease both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .buttons {
      display: flex; gap: 24px; align-items: center;
      animation: fadeSlideIn 1.4s ease both;
    }

    .btn-sim {
      padding: 18px 52px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), #c0394f);
      border: none; border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(232,73,106,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-sim::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      border-radius: inherit;
    }
    .btn-sim:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 14px 40px rgba(232,73,106,0.6); }
    .btn-sim:active { transform: scale(0.97); }

    /* ---- Botão Não — fixed, posicionado via JS ---- */
    #btn-nao {
      padding: 16px 44px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(15px, 2vw, 22px);
      color: #a07080;
      background: rgba(255,248,240,0.95);
      border: 2px solid #e0b0bb;
      border-radius: 50px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      position: fixed;
      z-index: 99;
      transition: left 0.15s ease-out, top 0.15s ease-out, color 0.2s, border-color 0.2s;
    }
    #btn-nao:hover { color: var(--rose); border-color: var(--rose); }

    /* ===== TELA DE CELEBRAÇÃO ===== */
    #celebration {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 50%, #1a0a10, #0d0508);
      z-index: 20;
      overflow: hidden;
    }
    #celebration.show { display: flex; }

    .celebration-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 72px);
      color: #fff;
      text-align: center;
      z-index: 5;
      animation: celebIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
      text-shadow: 0 0 40px rgba(212,168,83,0.8);
    }
    .celebration-sub {
      font-size: clamp(14px, 2vw, 22px);
      color: var(--blush);
      margin-top: 16px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 5;
      animation: celebIn 1s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes celebIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    #fireworks-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
    }
  </style>
</head>
<body>

<!-- ===== TELA DE PROPOSTA ===== -->
<div id="proposal">
  <div class="hearts-bg" id="hearts"></div>
  <div class="ring">💍</div>
  <h1 class="question">Quer <em>casar</em> comigo?</h1>
  <p class="subtitle">uma pergunta do coração</p>

  <div class="buttons">
    <button class="btn-sim" onclick="celebrate()">Sim 💕</button>
    <!--
      Placeholder invisível ao lado do Sim para reservar espaço visual.
      O botão Não real está fora deste container (abaixo), posicionado via JS.
    -->
    <div id="nao-placeholder" aria-hidden="true" style="
      padding:16px 44px;
      font-size:clamp(15px,2vw,22px);
      border:2px solid transparent;
      border-radius:50px;
      white-space:nowrap;
      visibility:hidden;
      pointer-events:none;">Não 😬</div>
  </div>
</div>

<!-- Botão Não fora de qualquer container — livre pela tela toda -->
<button id="btn-nao">Não 😬</button>

<!-- ===== TELA DE CELEBRAÇÃO ===== -->
<div id="celebration">
  <canvas id="fireworks-canvas"></canvas>
  <div class="celebration-text">🥂 Que felicidade! 🥂</div>
  <p class="celebration-sub">Eu sabia que você diria sim ❤️</p>
</div>

<script>
  /* ---- Corações flutuantes ---- */
  const heartsContainer = document.getElementById('hearts');
  const heartEmojis = ['❤️','💕','💖','💗','💓','🌹','✨'];
  for (let i = 0; i < 28; i++) {
    const h = document.createElement('span');
    h.className = 'heart-float';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.bottom = '-60px';
    h.style.animationDuration = (6 + Math.random() * 10) + 's';
    h.style.animationDelay  = (Math.random() * 12) + 's';
    heartsContainer.appendChild(h);
  }

  /* ---- Botão "Não" fugitivo ---- */
  const btnNao = document.getElementById('btn-nao');

  function posicionarNaoInicial() {
    const ph = document.getElementById('nao-placeholder');
    const r  = ph.getBoundingClientRect();
    // Coloca o botão real exatamente sobre o placeholder
    btnNao.style.left = r.left + 'px';
    btnNao.style.top  = r.top  + 'px';
  }

  // Tenta posicionar quando o DOM carrega e novamente após 400ms (fallback fonte)
  document.addEventListener('DOMContentLoaded', posicionarNaoInicial);
  window.addEventListener('load', posicionarNaoInicial);
  setTimeout(posicionarNaoInicial, 400);

  function moveNao() {
    const bw = btnNao.offsetWidth  || 150;
    const bh = btnNao.offsetHeight || 56;
    const margin = 16;
    const maxX = window.innerWidth  - bw - margin;
    const maxY = window.innerHeight - bh - margin;
    const x = margin + Math.random() * maxX;
    const y = margin + Math.random() * maxY;
    btnNao.style.left = x + 'px';
    btnNao.style.top  = y + 'px';
  }

  btnNao.addEventListener('mouseenter', moveNao);          // foge no hover (desktop)
  btnNao.addEventListener('click', moveNao);               // fallback se clicarem mesmo assim
  btnNao.addEventListener('touchstart', (e) => {           // mobile: foge no toque
    e.preventDefault();
    moveNao();
  }, { passive: false });

  /* ---- Celebração ---- */
  function celebrate() {
    const proposal = document.getElementById('proposal');
    proposal.style.opacity = '0';
    proposal.style.pointerEvents = 'none';
    btnNao.style.display = 'none';
    setTimeout(() => {
      document.getElementById('celebration').classList.add('show');
      startFireworks();
    }, 600);
  }

  /* ---- Fogos de artifício (Canvas) ---- */
  const canvas = document.getElementById('fireworks-canvas');
  const ctx    = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = [
    '#ff6b8a','#ffd700','#ff9900','#00e5ff','#ff4de3',
    '#7fffaa','#ff6347','#fffacd','#da70d6','#adff2f'
  ];

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed - 2;
      this.alpha  = 1;
      this.color  = color;
      this.radius = 2 + Math.random() * 3;
      this.gravity = 0.12;
      this.decay   = 0.012 + Math.random() * 0.01;
      this.trail   = [];
    }
    update() {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > 6) this.trail.shift();
      this.vy += this.gravity;
      this.x  += this.vx;
      this.y  += this.vy;
      this.alpha -= this.decay;
    }
    draw() {
      this.trail.forEach((p, i) => {
        ctx.globalAlpha = p.alpha * (i / this.trail.length) * 0.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = this.color; ctx.fill();
      });
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color; ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function explode(x, y) {
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const count = 80 + Math.floor(Math.random() * 60);
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function launchRandom() {
    const x = 0.1 * canvas.width  + Math.random() * 0.8 * canvas.width;
    const y = 0.1 * canvas.height + Math.random() * 0.5 * canvas.height;
    explode(x, y);
  }

  function loop() {
    ctx.fillStyle = 'rgba(13,5,8,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0.01);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  function startFireworks() {
    loop();
    launchRandom(); launchRandom();
    setInterval(() => {
      const burst = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < burst; i++) setTimeout(launchRandom, i * 150);
    }, 800);
  }
</script>
</body>
</html>
